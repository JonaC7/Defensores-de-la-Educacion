<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defensores de la Escuela</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF6FF;--card:#FFFFFF;--ink:#1B2A4A;--soft:#5B6B8C;--yel:#FFC93C;--grn:#2FB67C;--cor:#FF6B6B;--blu:#3B82F6;--line:#C9DDF2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12203A;--card:#1D2E52;--ink:#F3F7FF;--soft:#A9B8D6;--line:#34487A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12203A;--card:#1D2E52;--ink:#F3F7FF;--soft:#A9B8D6;--line:#34487A;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:19px;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:2.3rem;font-weight:700}
h2{font-size:1.5rem;font-weight:600}
p{margin:.5rem 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--blu);outline-offset:3px}
.btn{background:var(--yel);color:#1B2A4A;border:0;border-radius:18px;padding:14px 26px;font-weight:700;font-size:1.1rem;box-shadow:0 5px 0 #D99E00}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #D99E00}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:3px solid var(--line)}
.hero{text-align:center;padding:26px 0 10px}
.owl{font-size:5rem;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.say{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px 18px;margin:14px 0}
.map{display:grid;gap:12px;margin:18px 0}
.lv{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 16px}
.lv .n{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.6rem;color:#1B2A4A}
.lv small{display:block;color:var(--soft);font-size:.9rem}
.lv .st{margin-left:auto;font-size:1.2rem;white-space:nowrap}
.lv:disabled{opacity:.5;cursor:not-allowed}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .4s}
.q{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:20px}
.q h3{font-size:1.4rem;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:13px 16px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--blu);background:color-mix(in srgb,var(--blu) 18%,var(--card))}
.opt.good{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 25%,var(--card))}
.opt.bad{border-color:var(--cor);background:color-mix(in srgb,var(--cor) 22%,var(--card))}
.opts.two{grid-template-columns:1fr 1fr}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px;font-weight:500}
.fb.ok{background:color-mix(in srgb,var(--grn) 25%,var(--card))}
.fb.no{background:color-mix(in srgb,var(--yel) 35%,var(--card))}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.center{text-align:center}
.big{font-size:3rem;letter-spacing:.2rem}
.cert{border:6px double var(--yel);border-radius:26px;background:var(--card);padding:26px 18px;text-align:center;margin:16px 0}
.cert input{font:inherit;font-weight:600;text-align:center;width:100%;border:3px solid var(--line);border-radius:14px;padding:10px;background:var(--bg);color:var(--ink);margin:10px 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:3px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:21}
nav div{max-width:640px;margin:0 auto;display:flex;gap:8px;padding:8px 12px}
nav button{flex:1;background:transparent;border:3px solid transparent;border-radius:14px;padding:8px 4px;font-weight:600;font-size:1rem}
nav button[aria-current="page"]{background:var(--yel);color:#1B2A4A}
nav button:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.owl{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<nav aria-label="Navegación principal"><div><button data-r="inicio">🏠 Inicio</button><button data-r="mapa">🗺️ Niveles</button><button data-r="diploma">🎓 Diploma</button></div></nav>
<main id="app" aria-live="polite"></main>
<script>
var LV=[
{t:"Lo básico",c:"#FFC93C",intro:"Primero, lo más importante: ¡ir a la escuela es un DERECHO! Un derecho es algo que te pertenece por ser niño o niña.",qs:[
{q:"Todos los niños y niñas tienen derecho a ir a la escuela.",o:["Verdadero","Falso"],a:0,why:"¡Sí! Está escrito en la Convención sobre los Derechos del Niño."},
{q:"Solo los niños con mucho dinero pueden estudiar.",o:["Verdadero","Falso"],a:1,why:"Falso. La educación primaria debe ser gratuita para todos."},
{q:"Un derecho es algo que me pertenece por ser niño o niña.",o:["Verdadero","Falso"],a:0,why:"¡Exacto! Nadie te lo tiene que regalar: ya es tuyo."}]},
{t:"¿Quién puede estudiar?",c:"#2FB67C",intro:"Los derechos son para todos, sin excepción. Vamos a conocer a tres amigos.",qs:[
{q:"Ana vive en el campo, lejos de la ciudad. ¿Tiene derecho a estudiar?",o:["Sí, igual que todos","No, solo en la ciudad"],a:0,why:"Ana tiene el mismo derecho. El lugar donde vives no cambia tus derechos."},
{q:"Mateo usa silla de ruedas. ¿Qué debe pasar en su escuela?",o:["Que se quede en casa","Que lo ayuden a participar con sus compañeros"],a:1,why:"¡Correcto! Todos aprendemos juntos y la escuela debe ayudar."},
{q:"Sofía llegó de otro país hace una semana. ¿Puede ir a la escuela?",o:["Sí, venga de donde venga","Solo si nació aquí"],a:0,why:"Todos los niños tienen derecho a estudiar, vengan de donde vengan."}]},
{t:"Lo que necesito para aprender",c:"#3B82F6",intro:"Para que el derecho a la educación sea de verdad, hacen falta varias cosas. ¡Tú decides cuáles!",qs:[
{q:"Toca TODO lo que me ayuda a aprender bien:",m:1,o:["Maestros que enseñan","Libros y útiles","Un lugar seguro","Tiempo para jugar y descansar","Un videojuego carísimo","Que me griten si me equivoco","Respeto de todos"],a:[0,1,2,3,6],why:"Aprendemos mejor con maestros, útiles, seguridad, descanso y respeto."},
{q:"¿Por qué es importante la educación?",o:["Me ayuda a crecer y cumplir mis sueños","Solo sirve para sacar notas"],a:0,why:"La escuela te da herramientas para ser quien quieras ser."}]},
{t:"¿Se respeta mi derecho?",c:"#FF6B6B",intro:"Ahora eres detective. Lee cada historia y descubre si se respeta el derecho a la educación.",qs:[
{q:"Luis no puede ir a clases porque debe trabajar todo el día.",o:["Sí se respeta","No se respeta"],a:1,why:"Los niños deben estar en la escuela y jugar, no trabajar todo el día."},
{q:"Carla va a la escuela y su maestra la escucha con atención.",o:["Sí se respeta","No se respeta"],a:0,why:"¡Muy bien! Ser escuchada es parte de una buena educación."},
{q:"A una niña no la dejan estudiar “porque es niña”.",o:["Sí se respeta","No se respeta"],a:1,why:"Niñas y niños tienen exactamente los mismos derechos."}]},
{t:"Defensores de la escuela",c:"#9B6BFF",intro:"Último nivel: ¡puedes ayudar a que todos los niños estudien! ¿Qué harías tú?",qs:[
{q:"Un amigo dejó de ir a la escuela y no sabes por qué. ¿Qué haces?",o:["Lo cuento a un adulto de confianza","Me burlo de él","No hago nada"],a:0,why:"Pedir ayuda a tu familia o a tu maestra es una gran idea."},
{q:"Alguien dice que las niñas no deben estudiar. ¿Qué respondes?",o:["Tienes razón","Todos tenemos derecho a estudiar"],a:1,why:"Responder con respeto y firmeza es ser defensor de derechos."},
{q:"¿Quién debe cuidar que todos los niños puedan estudiar?",o:["Familia, escuela y gobierno juntos","Solo los niños"],a:0,why:"Es tarea de todos, ¡y tú también puedes ayudar!"}]}
];
var S={scr:"home",lv:0,qi:0,ok:0,sel:[],done:false,stars:[0,0,0,0,0],name:""};
var app=document.getElementById("app");
function h(s){app.innerHTML=s;var f=app.querySelector("h1,h2");if(f){f.setAttribute("tabindex","-1");f.focus({preventScroll:true})}window.scrollTo(0,0)}
function star(n){return "⭐".repeat(n)+"☆".repeat(3-n)}
function total(){return S.stars.reduce(function(a,b){return a+b},0)}
function home(){S.scr="home";nav("inicio");h('<div class="hero"><div class="owl" aria-hidden="true">🦉</div><h1>Defensores de la Escuela</h1><p>¡Hola! Soy el Búho Sabio. Juntos aprenderemos sobre tu derecho a la educación.</p><button class="btn" id="go">¡Empezar!</button></div>');document.getElementById("go").onclick=map}
function map(){S.scr="map";nav("mapa");var b="";LV.forEach(function(l,i){var open=i==0||S.stars[i-1]>0;b+='<button class="lv" data-i="'+i+'"'+(open?"":" disabled")+'><span class="n" style="background:'+l.c+'">'+(i+1)+'</span><span><b>'+l.t+'</b><small>'+(open?"Nivel "+(i+1):"Termina el nivel anterior")+'</small></span><span class="st">'+(S.stars[i]?star(S.stars[i]):(open?"▶":"🔒"))+'</span></button>'});
h('<div class="top"><h2>Elige un nivel</h2><span>⭐ '+total()+'/15</span></div><div class="map">'+b+'</div>'+(S.stars.every(function(x){return x>0})?'<button class="btn" id="fin">Ver mi diploma 🎓</button>':''));
app.querySelectorAll(".lv").forEach(function(e){e.onclick=function(){start(+e.dataset.i)}});var f=document.getElementById("fin");if(f)f.onclick=cert}
function start(i){nav("nivel-"+(i+1));S.lv=i;S.qi=0;S.ok=0;S.scr="intro";var l=LV[i];h('<div class="top"><span class="owl" style="font-size:2.6rem;animation:none" aria-hidden="true">🦉</span><button class="btn ghost" id="bk">Mapa</button></div><h2>Nivel '+(i+1)+': '+l.t+'</h2><div class="say">'+l.intro+'</div><button class="btn" id="go">¡Vamos!</button>');document.getElementById("bk").onclick=map;document.getElementById("go").onclick=ask}
function ask(){var l=LV[S.lv],q=l.qs[S.qi];S.sel=[];S.done=false;
var o="";q.o.forEach(function(t,i){o+='<button class="opt" data-i="'+i+'"'+(q.m?' aria-pressed="false"':'')+'>'+t+'</button>'});
h('<div class="top"><b>Nivel '+(S.lv+1)+' · '+l.t+'</b><span>'+(S.qi+1)+'/'+l.qs.length+'</span></div><div class="bar"><i style="width:'+(S.qi/l.qs.length*100)+'%;background:'+l.c+'"></i></div><div class="q"><h3>'+q.q+'</h3><div class="opts'+(!q.m&&q.o.length==2?" two":"")+'">'+o+'</div><div id="fb"></div><div class="actions" id="ac">'+(q.m?'<button class="btn" id="chk">Comprobar</button>':'')+'</div></div>');
var bs=app.querySelectorAll(".opt");bs.forEach(function(b){b.onclick=function(){if(S.done)return;var i=+b.dataset.i;if(q.m){var k=S.sel.indexOf(i);if(k<0)S.sel.push(i);else S.sel.splice(k,1);b.setAttribute("aria-pressed",k<0)}else grade([i])}});
var c=document.getElementById("chk");if(c)c.onclick=function(){if(S.sel.length)grade(S.sel)}}
function grade(sel){var l=LV[S.lv],q=l.qs[S.qi];S.done=true;var right=q.m?q.a:[q.a];
var good=sel.length==right.length&&sel.every(function(x){return right.indexOf(x)>-1});if(good)S.ok++;
app.querySelectorAll(".opt").forEach(function(b,i){var r=right.indexOf(i)>-1;if(r)b.classList.add("good");else if(sel.indexOf(i)>-1)b.classList.add("bad");b.disabled=true});
var last=S.qi==l.qs.length-1;
document.getElementById("fb").innerHTML='<div class="fb '+(good?"ok":"no")+'">'+(good?"🎉 ¡Muy bien! ":"🤔 ¡Casi! ")+q.why+'</div>';
document.getElementById("ac").innerHTML='<button class="btn" id="nx">'+(last?"Terminar nivel":"Siguiente")+'</button>';
var n=document.getElementById("nx");n.focus();n.onclick=function(){if(last)endLv();else{S.qi++;ask()}}}
function endLv(){var l=LV[S.lv],n=l.qs.length,s=Math.max(1,Math.round(S.ok/n*3));if(s>S.stars[S.lv])S.stars[S.lv]=s;
var msg=s==3?"¡Perfecto!":s==2?"¡Muy bien!":"¡Buen intento! Puedes repetirlo y ganar más estrellas.";
h('<div class="center"><div class="owl" aria-hidden="true">🦉</div><h2>Nivel '+(S.lv+1)+' completado</h2><div class="big" aria-label="'+s+' estrellas">'+star(s)+'</div><p>'+msg+' Acertaste '+S.ok+' de '+n+'.</p><div class="actions" style="justify-content:center"><button class="btn ghost" id="rp">Repetir</button><button class="btn" id="nx">'+(S.lv<4?"Siguiente nivel":"Ver mi diploma 🎓")+'</button></div></div>');
document.getElementById("rp").onclick=function(){start(S.lv)};document.getElementById("nx").onclick=function(){if(S.lv<4)start(S.lv+1);else cert()}}
function cert(){S.scr="cert";nav("diploma");h('<div class="cert"><div class="owl" aria-hidden="true">🏅</div><h2>Diploma de Defensor de la Escuela</h2><p>Se entrega a:</p><input id="nm" maxlength="30" placeholder="Escribe tu nombre" aria-label="Tu nombre" value="'+S.name.replace(/"/g,"")+'"><p id="who"></p><p><b>Tengo derecho a estudiar.<br>Todos los niños y niñas también.</b></p><div class="big" aria-hidden="true">'+star(Math.min(3,Math.round(total()/5)))+'</div><p>Estrellas ganadas: '+total()+' de 15</p></div><div class="actions" style="justify-content:center"><button class="btn ghost" id="mp">Volver al mapa</button><button class="btn" id="pr">Imprimir 🖨️</button></div>');
var nm=document.getElementById("nm"),w=document.getElementById("who");function u(){S.name=nm.value;w.textContent=nm.value?"¡Felicidades, "+nm.value+"!":""}nm.oninput=u;u();
document.getElementById("mp").onclick=map;document.getElementById("pr").onclick=function(){try{window.print()}catch(e){}}}
function allDone(){return S.stars.every(function(x){return x>0})}
function nav(r){S.cur=r;try{if(location.hash!=="#"+r)location.hash=r}catch(e){}
var k=r.indexOf("nivel")==0?"mapa":r;
document.querySelectorAll("nav button").forEach(function(b){if(b.dataset.r==k)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");if(b.dataset.r=="diploma"){b.disabled=!allDone();b.title=allDone()?"":"Termina los 5 niveles para ganar tu diploma"}})}
function route(){var r=(location.hash||"").slice(1);if(r&&r===S.cur)return;
if(r=="mapa")map();
else if(r.indexOf("nivel-")==0){var n=+r.split("-")[1];if(n>=1&&n<=5&&(n==1||S.stars[n-2]>0))start(n-1);else map()}
else if(r=="diploma"){if(allDone())cert();else map()}
else home()}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){var r=b.dataset.r;if(r=="inicio")home();else if(r=="mapa")map();else if(allDone())cert()}});
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
